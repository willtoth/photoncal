name: Check and deploy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:deploy
      - run: npm run verify:engine
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: PHOTONCAL_PRODUCTION=1 npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Publish Cloudflare Pages
    needs: browser
    if: >-
      github.repository == 'willtoth/photoncal' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://photoncal.pages.dev
    env:
      # Public account identifier; the scoped API token is a repository secret.
      CLOUDFLARE_ACCOUNT_ID: d8499930f2cd2e62ffedca626b2f71af
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit permission for the configured account.'
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache pinned native sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps
          key: native-source-${{ runner.os }}-${{ hashFiles('scripts/native-sources.mjs', 'scripts/build-native.mjs') }}
      - name: Build site and complete corresponding source
        run: npm run build:cloudflare
      - name: Skip superseded main commits
        id: current
        run: |
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote_main_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A newer main commit exists; this run will not overwrite production.'
          fi
      - name: Publish production
        if: steps.current.outputs.deploy == 'true'
        id: publish
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: pages deploy .build/cloudflare --project-name photoncal --branch main --commit-hash ${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published assets
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
        run: node scripts/verify-deployment.mjs "$DEPLOYMENT_URL"
